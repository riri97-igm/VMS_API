name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH key
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s\n" "$DO_SSH_KEY" > ~/.ssh/do_key
          chmod 600 ~/.ssh/do_key

      - name: Deploy over native SSH
        env:
          APP_PATH: /var/www/ingyin-api
          APPSETTINGS_SOURCE: /var/www/ingyin-secrets/appsettings.json
          APPSETTINGS_PRODUCTION_SOURCE: /var/www/ingyin-secrets/appsettings.Production.json
          BRANCH: ${{ github.ref_name }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USERNAME: ${{ secrets.DO_USERNAME }}
          DO_PORT: ${{ secrets.DO_PORT }}
          SERVICE_NAME: ${{ secrets.DO_SYSTEMD_SERVICE || 'vms-api.service' }}
          SERVICE_USER: ${{ secrets.DO_SERVICE_USER }}
        run: |
          set -euo pipefail
          : "${DO_HOST:?DO_HOST secret is required}"
          : "${DO_USERNAME:?DO_USERNAME secret is required}"
          DO_PORT="${DO_PORT:-22}"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/do_key -p "$DO_PORT" "$DO_USERNAME@$DO_HOST" <<EOF
          set -euo pipefail

          cd "$APP_PATH"

          # Ensure deploy target exactly matches remote branch, even after force-pushes.
          git fetch origin "$BRANCH" --prune
          git reset --hard
          git clean -fdx
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git reset --hard "origin/$BRANCH"

          # Restore server-only settings after syncing repository.
          if [ ! -f "$APPSETTINGS_SOURCE" ]; then
            echo "Missing appsettings source: $APPSETTINGS_SOURCE"
            exit 1
          fi
          sudo cp "$APPSETTINGS_SOURCE" "$APP_PATH/VMS.API/appsettings.json"
          if [ -f "$APPSETTINGS_PRODUCTION_SOURCE" ]; then
            sudo cp "$APPSETTINGS_PRODUCTION_SOURCE" "$APP_PATH/VMS.API/appsettings.Production.json"
          fi

          mkdir -p "$APP_PATH/publish"
          dotnet --info
          dotnet restore VMS.API.sln
          dotnet build VMS.API.sln -c Release --no-restore
          dotnet publish VMS.API/VMS.API.csproj -c Release --no-build -o "$APP_PATH/publish"

          # Ensure runtime config is deployed and readable by the service user.
          sudo cp "$APPSETTINGS_SOURCE" "$APP_PATH/publish/appsettings.json"
          if [ -f "$APPSETTINGS_PRODUCTION_SOURCE" ]; then
            sudo cp "$APPSETTINGS_PRODUCTION_SOURCE" "$APP_PATH/publish/appsettings.Production.json"
          fi
          if [ -z "${SERVICE_USER:-}" ]; then
            SERVICE_USER="$(sudo systemctl show -p User --value "$SERVICE_NAME" || true)"
          fi
          SERVICE_USER="${SERVICE_USER:-www-data}"
          sudo chown root:"$SERVICE_USER" "$APP_PATH/publish/appsettings.json"
          sudo chmod 640 "$APP_PATH/publish/appsettings.json"
          if [ -f "$APP_PATH/publish/appsettings.Production.json" ]; then
            sudo chown root:"$SERVICE_USER" "$APP_PATH/publish/appsettings.Production.json"
            sudo chmod 640 "$APP_PATH/publish/appsettings.Production.json"
          fi

          sudo systemctl restart "$SERVICE_NAME"
          sudo systemctl status "$SERVICE_NAME" --no-pager
          EOF
